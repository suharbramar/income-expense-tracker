name: Develop Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: 18
  APP_DIR: /var/www/income-expense
  DATA_DIR: /var/www/income-expense/data
  SSH_PORT: 22

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies (client)
        run: npm ci
        working-directory: client

      - name: Install dependencies (server)
        run: npm ci
        working-directory: server

      - name: Run tests (client)
        env:
          CI: true
        run: npm test -- --watch=false --passWithNoTests
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: income-expense-build
          path: |
            client/build
            server/package.json
            server/package-lock.json
            server/data.json

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: income-expense-build
          path: release

      - name: Copy files to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT != '' && secrets.DO_PORT || env.SSH_PORT }}
          source: "release/*"
          target: "${{ env.APP_DIR }}/release"
          strip_components: 1

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT != '' && secrets.DO_PORT || env.SSH_PORT }}
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/var/www/income-expense}"
            DATA_DIR="${DATA_DIR:-/var/www/income-expense/data}"
            sudo mkdir -p "$APP_DIR" "$DATA_DIR"
            sudo chown "$USER":"$USER" "$APP_DIR" "$DATA_DIR"

            # seed persistent data on first deploy
            if [ ! -f "$DATA_DIR/data.json" ] && [ -f "$APP_DIR/release/server/data.json" ]; then
              cp "$APP_DIR/release/server/data.json" "$DATA_DIR/data.json"
            fi

            # sync new build and server files
            rm -rf "$APP_DIR/client_build" && cp -r "$APP_DIR/release/client/build" "$APP_DIR/client_build"
            rm -rf "$APP_DIR/server" && cp -r "$APP_DIR/release/server" "$APP_DIR/server"
            cp "$DATA_DIR/data.json" "$APP_DIR/server/data.json"

            # install runtime deps
            cd "$APP_DIR/server"
            npm ci --production
            npm install -g pm2 serve

            # restart services
            pm2 delete income-expense-api || true
            pm2 delete income-expense-web || true
            pm2 start "npx json-server --host 0.0.0.0 --port 3001 data.json" --name income-expense-api --cwd "$APP_DIR/server"
            pm2 start "npx serve -s $APP_DIR/client_build -l 3000" --name income-expense-web --cwd "$APP_DIR"
            pm2 save

            # clean temp
            rm -rf "$APP_DIR/release"
