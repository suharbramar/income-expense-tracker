name: Develop Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: 18
  APP_DIR: /var/www/income-expense
  DATA_DIR: /var/www/income-expense/data
  SSH_PORT: 22
  CI: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies (client)
        run: npm ci
        working-directory: client

      - name: Install dependencies (server)
        run: npm ci
        working-directory: server

      - name: Run tests (client)
        run: npm test -- --watch=false --passWithNoTests
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: income-expense-build
          path: |
            client/build
            server/package.json
            server/package-lock.json
            server/data.json

  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH connectivity only
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT != '' && secrets.DO_PORT || env.SSH_PORT }}
          script: |
            set -euo pipefail
            echo "SSH connection succeeded on $(hostname)"
            echo "Server time: $(date -Iseconds)"
            echo "Working directory: $(pwd)"
